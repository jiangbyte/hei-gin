app:
  name: hei-gin
  host: 127.0.0.1
  port: 8000
  debug: true
  timezone: Asia/Shanghai

db:
  url: postgres://postgres:123456@127.0.0.1:5432/hei_gin?sslmode=disable
  echo: false
  pool_size: 10
  max_overflow: 20

redis:
  url: redis://:123456@127.0.0.1:6379/4
  max_connections: 100

auth:
  token_name: Authorization
  token_ttl_seconds: 14400
  token_ttl_short_seconds: 7200
  portal_register_enabled: true
  login_failure_window_seconds: 900
  login_account_max_failures: 5
  login_ip_max_failures: 30
  login_lock_seconds: 900
  captcha_ttl_seconds: 300
  password_crypto_key_ttl_seconds: 600
  session_idle_timeout_seconds: 0
  session_bind_ip: true
  session_bind_user_agent: false
  max_concurrent_sessions: 5
  session_cookie_enabled: true
  session_cookie_name: Authorization
  session_cookie_secure: false
  session_cookie_samesite: lax
  session_cookie_path: /
  default_password: "123456"
  auth_whitelist: []

cors:
  allow_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:5174
    - http://127.0.0.1:5174
    - http://localhost:5163
    - http://127.0.0.1:5163
  allow_credentials: true
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allow_headers:
    - Authorization
    - Content-Type
    - X-Request-Id
    - Accept
    - Origin
    - X-Requested-With
    - X-HEI-CSRF

xxl_job:
  enabled: true
  access_token: default_token
  admin:
    addresses: http://127.0.0.1:9004/xxl-job-admin
  executor:
    appname: hei-gin-api
    port: 9999

storage:
  provider: local
  bucket: hei-gin
  endpoint: http://127.0.0.1:9000
  access_key: minioadmin
  secret_key: minioadmin
  region: us-east-1
  use_ssl: false
  presign_expire_seconds: 3600
  base_url: ""
  public_path: /api/v1/files
  local_root: storage

id_generator:
  worker_id: 1
  datacenter_id: 1

modules:
  disabled: []
  enabled: []

audit:
  operation_queue_size: 1000
