app:
  name: hei-gin
  host: 127.0.0.1
  port: 8000
  debug: true
  timezone: Asia/Shanghai

db:
  url: postgres://postgres:123456@127.0.0.1:5432/hei_gin?sslmode=disable
  echo: false
  pool_size: 10
  max_overflow: 20

redis:
  url: redis://:123456@127.0.0.1:6379/4
  max_connections: 100

auth:
  token_name: Authorization
  token_ttl_seconds: 14400
  token_ttl_short_seconds: 7200
  portal_register_enabled: true
  login_failure_window_seconds: 900
  login_account_max_failures: 5
  login_ip_max_failures: 30
  login_lock_seconds: 900
  captcha_ttl_seconds: 300
  password_crypto_key_ttl_seconds: 600
  session_idle_timeout_seconds: 0
  session_bind_ip: true
  session_bind_user_agent: false
  max_concurrent_sessions: 5
  session_cookie_enabled: true
  session_cookie_name: Authorization
  session_cookie_secure: false
  session_cookie_samesite: lax
  session_cookie_path: /
  default_password: "123456"
  # 门户公开接口（匿名可访问）：banner 列表/互动、字典树、公告列表
  auth_whitelist:
    - /api/v1/portal/sys/banners/list
    - /api/v1/portal/sys/banners/interaction
    - /api/v1/portal/sys/dicts/tree
    - /api/v1/portal/sys/notices/list

cors:
  allow_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
    - http://localhost:5174
    - http://127.0.0.1:5174
    - http://localhost:5163
    - http://127.0.0.1:5163
  allow_credentials: true
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allow_headers:
    - Authorization
    - Content-Type
    - X-Request-Id
    - Accept
    - Origin
    - X-Requested-With
    - X-HEI-CSRF


snail_job:
  enabled: true
  server_host: 127.0.0.1
  server_port: "17888"
  host_ip: 127.0.0.1
  host_port: "17889"
  namespace: c8f1a2b3d4e5461789abcdef01234567
  group_name: hei_gin_admin
  token: SJ_heiGinAdminToken1234567890abcd

storage:
  provider: local
  bucket: hei-gin
  endpoint: http://127.0.0.1:9000
  access_key: minioadmin
  secret_key: minioadmin
  region: us-east-1
  use_ssl: false
  presign_expire_seconds: 3600
  base_url: ""
  public_path: /api/v1/files
  local_root: storage

id_generator:
  worker_id: 1
  datacenter_id: 1

modules:
  disabled: []
  enabled: []

audit:
  operation_queue_size: 1000
  stream_key: hei:audit:ops
  consumer_group: hei-gin-audit
  use_stream: true

oauth:
  github:
    client_id: ""
    client_secret: ""
    redirect_url: ""
  gitee:
    client_id: ""
    client_secret: ""
    redirect_url: ""
  wechat:
    client_id: ""
    client_secret: ""
    redirect_url: ""

metrics:
  enabled: true
  path: /metrics

security:
  hsts_enabled: false
  hsts_max_age_seconds: 31536000

notify:
  mail:
    enabled: false
    host: ""
    port: 587
    username: ""
    password: ""
    from: ""
    ssl: false
  sms:
    enabled: false
    provider: log
  push:
    enabled: false

otel:
  enabled: false
  endpoint: ""

crypto:
  fernet_key: ""
  vault_addr: ""
  vault_token: ""
